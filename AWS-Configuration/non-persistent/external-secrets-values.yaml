# External Secrets Operator chart 2.14.0 overrides. The chart sets no requests/limits by default; set them like the
# other platform charts so the pods fit small nodes predictably.
resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { cpu: 200m, memory: 128Mi }

webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

certController:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }
