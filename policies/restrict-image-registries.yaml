# Images must be our own, from our ECR, or one of two official datastore images allow-listed by exact digest.
# Docker Hub tags are mutable, so the allow-list pins digests; gitops/postgres and gitops/redis values.yaml pin the same
# ones. Change both together. In production these would be mirrored (ECR pull-through cache) instead (ADR 0013).
# Deny (Phase 07.6): proven by kyverno test + every chart in CI. Fails closed: if Kyverno is down, new pods in
# sanctions-platform are blocked; argocd, kube-system and kyverno are excluded so recovery is always possible.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict image registries
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Images must come from this account's complianceops ECR repositories, except the allow-listed,
      digest-pinned postgres and redis images.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: sanctions-platform
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: [deployments]
  variables:
    - name: images
      expression: >-
        object.spec.containers.map(c, c.image) +
        object.spec.?initContainers.orValue([]).map(c, c.image)
    - name: allowed
      expression: >-
        [
          'postgres:16.15-trixie@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32',
          'redis:8.10.3-trixie@sha256:f245f4c83b84a9e9a0588da1c9456e579455310f0945d5db52cd2ba27f2000cc'
        ]
  validations:
    - expression: >-
        variables.images.all(img,
          img.startsWith('697961193772.dkr.ecr.us-west-2.amazonaws.com/complianceops-') ||
          img in variables.allowed)
      message: >-
        Images must come from 697961193772.dkr.ecr.us-west-2.amazonaws.com/complianceops-*,
        or be an allow-listed, digest-pinned postgres or redis image.
