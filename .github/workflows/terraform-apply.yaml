name: Terraform Apply

# Push / PR  -> fmt + validate + plan only (never creates billable infra on its own)
# Manual run -> plan + apply (Actions tab -> Terraform Apply -> Run workflow)
on:
  push:
    branches: [main]
    paths:
      - "AWS-Configuration/**"
      - ".github/workflows/terraform-apply.yaml"
  pull_request:
    paths:
      - "AWS-Configuration/**"
      - ".github/workflows/terraform-apply.yaml"
  workflow_dispatch:
    inputs:
      apply_non_persistent:
        description: "Also apply non-persistent (VPC + EKS + nodes — starts NAT/EKS billing)"
        type: boolean
        default: true

permissions:
  id-token: write   # required for OIDC
  contents: read

# One Terraform run at a time across apply/destroy workflows, so two runs
# never race on the same state. Queued runs wait instead of being cancelled.
concurrency:
  group: terraform-complianceops
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  # Must be >= the version that last wrote the state (local machine runs 1.16.2),
  # otherwise init refuses to read a state snapshot from a newer Terraform.
  TF_VERSION: "1.16.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  persistent:
    name: persistent (state bucket, ECR, SQS, CI role)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AWS-Configuration/persistent
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -diff
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan

      - name: terraform apply
        if: github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan

  non-persistent:
    name: non-persistent (VPC, EKS, IRSA, namespace)
    needs: persistent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AWS-Configuration/non-persistent
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -diff
      - run: terraform init
      - run: terraform validate

      - name: terraform plan
        if: github.event_name != 'workflow_dispatch' || !inputs.apply_non_persistent
        run: terraform plan -var="create_node_group=true"

      # Single apply: addon ordering is handled in main.tf (vpc-cni/kube-proxy
      # before_compute, coredns + ebs-csi after the node group). The old
      # two-phase apply created coredns/ebs-csi with no nodes -> DEGRADED -> 20m timeout.
      - name: terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply_non_persistent
        run: terraform apply -auto-approve -var="create_node_group=true"

      # Post-apply smoke test: green run = cluster is actually usable, so no
      # local kubectl checks are needed before starting work.
      - name: verify cluster
        if: github.event_name == 'workflow_dispatch' && inputs.apply_non_persistent
        shell: bash
        env:
          CLUSTER: complianceops-eks
          # Same as var.admin_user_arn in non-persistent/main.tf
          ADMIN_USER_ARN: arn:aws:iam::697961193772:user/Ankit-CLI
        run: |
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          kubectl version --client

          echo "::group::EKS add-ons ACTIVE"
          for addon in vpc-cni kube-proxy coredns aws-ebs-csi-driver; do
            aws eks wait addon-active --cluster-name "$CLUSTER" --addon-name "$addon"
            echo "$addon: ACTIVE"
          done
          echo "::endgroup::"

          echo "::group::Nodes Ready"
          kubectl wait --for=condition=Ready nodes --all --timeout=5m
          kubectl get nodes -o wide
          echo "::endgroup::"

          echo "::group::System workloads rolled out"
          for ds in aws-node kube-proxy ebs-csi-node; do
            kubectl -n kube-system rollout status daemonset/$ds --timeout=5m
          done
          for deploy in coredns ebs-csi-controller; do
            kubectl -n kube-system rollout status deployment/$deploy --timeout=5m
          done
          echo "::endgroup::"

          echo "::group::DNS + NAT egress (pulls an image from Docker Hub, resolves a service name)"
          kubectl run verify-dns --image=busybox:1.36 --restart=Never --rm -i \
            --pod-running-timeout=3m -- nslookup kubernetes.default.svc.cluster.local
          echo "::endgroup::"

          echo "::group::App namespace, service accounts, IRSA annotations"
          kubectl get namespace sanctions-platform
          for sa in transaction-sa notifier-sa; do
            role=$(kubectl -n sanctions-platform get sa "$sa" -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}')
            [[ "$role" == arn:aws:iam::* ]] || { echo "::error::$sa has no IRSA role annotation"; exit 1; }
            echo "$sa -> $role"
          done
          echo "::endgroup::"

          echo "::group::Local kubectl access (Ankit-CLI access entry)"
          aws eks list-associated-access-policies --cluster-name "$CLUSTER" --principal-arn "$ADMIN_USER_ARN" \
            --query 'associatedAccessPolicies[].policyArn' --output text | grep -q AmazonEKSClusterAdminPolicy \
            || { echo "::error::$ADMIN_USER_ARN has no cluster-admin access policy"; exit 1; }
          echo "Ankit-CLI has AmazonEKSClusterAdminPolicy"
          echo "::endgroup::"

          {
            echo "## Cluster ready ✅"
            echo '```'
            kubectl get nodes
            echo
            kubectl get pods -n kube-system
            echo '```'
            echo "Connect locally: \`aws eks update-kubeconfig --name $CLUSTER --region $AWS_REGION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Terraform only proves Argo CD itself is running; it deploys the apps asynchronously afterwards.
      # Green here means every gitops/ chart is Synced (matches Git) and Healthy (actually working).
      - name: verify apps (Argo CD)
        if: github.event_name == 'workflow_dispatch' && inputs.apply_non_persistent
        shell: bash
        run: |
          # One Application per chart folder; counted, not hardcoded, so a new service is covered too
          expected=$(find "$GITHUB_WORKSPACE/gitops" -mindepth 2 -maxdepth 2 -name Chart.yaml | wc -l)
          status() {
            kubectl -n argocd get applications -o custom-columns='NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status'
          }

          echo "::group::ApplicationSet generated $expected Applications"
          for _ in $(seq 36); do
            count=$( (kubectl -n argocd get applications --no-headers 2>/dev/null || true) | wc -l)
            [ "$count" -ge "$expected" ] && break
            sleep 5
          done
          if [ "$count" -lt "$expected" ]; then
            echo "::error::expected $expected Applications (one per gitops/ chart), found $count"
            kubectl -n argocd get applicationset services -o jsonpath='{.status.conditions}'; echo
            exit 1
          fi
          status
          echo "::endgroup::"

          # First boot: screening/transaction may restart until redis/postgres are up, hence 10m
          echo "::group::All Applications Synced and Healthy"
          if ! kubectl -n argocd wait applications --all --for=jsonpath='{.status.sync.status}'=Synced --timeout=10m \
            || ! kubectl -n argocd wait applications --all --for=jsonpath='{.status.health.status}'=Healthy --timeout=10m; then
            echo "::error::not every Application became Synced and Healthy"
            kubectl -n argocd get applications -o custom-columns='NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,MESSAGE:.status.health.message,OPERATION:.status.operationState.message,CONDITIONS:.status.conditions[*].message'
            kubectl -n sanctions-platform get pods
            exit 1
          fi
          status
          echo "::endgroup::"

          {
            echo "## Apps deployed by Argo CD ✅"
            echo '```'
            status
            echo
            kubectl -n sanctions-platform get pods
            echo '```'
            echo "Argo CD UI: \`kubectl -n argocd port-forward svc/argocd-server 8080:443\`, user \`admin\`, initial password in the \`argocd-initial-admin-secret\` Secret"
          } >> "$GITHUB_STEP_SUMMARY"

      # Phase 07 guardrails, proven on every rebuild (ADR 0013-0015): policies Ready, the Postgres secret synced from
      # Secrets Manager, no policy violations by the running apps, and every bad test manifest rejected at admission.
      # Server-side dry-run goes through the admission webhooks but creates nothing.
      - name: verify guardrails (Kyverno, External Secrets)
        if: github.event_name == 'workflow_dispatch' && inputs.apply_non_persistent
        shell: bash
        run: |
          echo "::group::Kyverno policies Ready"
          kubectl wait validatingpolicies.policies.kyverno.io --all \
            --for=jsonpath='{.status.conditionStatus.ready}'=true --timeout=3m
          kubectl wait imagevalidatingpolicies.policies.kyverno.io --all \
            --for=jsonpath='{.status.conditionStatus.ready}'=true --timeout=3m
          kubectl get validatingpolicies.policies.kyverno.io,imagevalidatingpolicies.policies.kyverno.io
          echo "::endgroup::"

          echo "::group::Postgres secret synced from Secrets Manager"
          kubectl -n sanctions-platform wait --for=condition=Ready \
            secretstore/aws-secrets-manager externalsecret/postgres-credentials --timeout=3m
          kubectl -n sanctions-platform get secret postgres-credentials -o jsonpath='{.data}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert {"POSTGRES_PASSWORD","DATABASE_URL"} <= d.keys(), d.keys(); print("keys:", sorted(d))'
          echo "::endgroup::"

          echo "::group::No policy violations by the running apps (PolicyReports)"
          for _ in $(seq 24); do
            n=$( (kubectl -n sanctions-platform get policyreports --no-headers 2>/dev/null || true) | wc -l)
            [ "$n" -gt 0 ] && break
            sleep 5
          done
          [ "$n" -gt 0 ] || { echo "::error::no PolicyReports after 2 min: is the Kyverno reports controller running?"; exit 1; }
          kubectl -n sanctions-platform get policyreports
          bad=$(kubectl -n sanctions-platform get policyreports -o json \
            | python3 -c 'import json,sys; print(sum(r.get("summary",{}).get("fail",0)+r.get("summary",{}).get("error",0) for r in json.load(sys.stdin)["items"]))')
          [ "$bad" -eq 0 ] || { echo "::error::$bad policy fail/error results in sanctions-platform"; exit 1; }
          echo "::endgroup::"

          echo "::group::Admission: bad manifests rejected, good ones accepted (tests/policies, same cases as CI)"
          dir="$RUNNER_TEMP/admission"; mkdir -p "$dir"
          # One file per test resource, named after it (yq is preinstalled on GitHub's Ubuntu runners)
          (cd "$dir" && yq -s '.metadata.name' "$GITHUB_WORKSPACE/tests/policies/resources.yaml")
          failed=0
          for f in "$dir"/*.yml; do
            name=$(basename "$f" .yml)
            if out=$(kubectl apply --dry-run=server -f "$f" 2>&1); then
              if [[ "$name" == bad-* ]]; then echo "::error::$name was ACCEPTED"; failed=1; else echo "accepted (expected): $name"; fi
            else
              if [[ "$name" == good-* ]]; then echo "::error::$name was REJECTED: $out"; failed=1
              elif ! grep -qi kyverno <<<"$out"; then echo "::error::$name rejected, but not by Kyverno: $out"; failed=1
              else echo "rejected (expected): $name -> $(grep -o 'denied the request.*' <<<"$out" | head -c 200)"; fi
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "::endgroup::"

          {
            echo "## Guardrails ✅"
            echo '```'
            kubectl get validatingpolicies.policies.kyverno.io,imagevalidatingpolicies.policies.kyverno.io
            echo
            kubectl -n sanctions-platform get secretstore,externalsecret
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
