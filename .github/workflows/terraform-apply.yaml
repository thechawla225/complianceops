name: Terraform Apply

# Push / PR  -> fmt + validate + plan only (never creates billable infra on its own)
# Manual run -> plan + apply (Actions tab -> Terraform Apply -> Run workflow)
on:
  push:
    branches: [main]
    paths:
      - "AWS-Configuration/**"
      - ".github/workflows/terraform-apply.yaml"
  pull_request:
    paths:
      - "AWS-Configuration/**"
      - ".github/workflows/terraform-apply.yaml"
  workflow_dispatch:
    inputs:
      apply_non_persistent:
        description: "Also apply non-persistent (VPC + EKS + nodes — starts NAT/EKS billing)"
        type: boolean
        default: true

permissions:
  id-token: write   # required for OIDC
  contents: read

# One Terraform run at a time across apply/destroy workflows, so two runs
# never race on the same state. Queued runs wait instead of being cancelled.
concurrency:
  group: terraform-complianceops
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  # Must be >= the version that last wrote the state (local machine runs 1.16.2),
  # otherwise init refuses to read a state snapshot from a newer Terraform.
  TF_VERSION: "1.16.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  persistent:
    name: persistent (state bucket, ECR, SQS, CI role)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AWS-Configuration/persistent
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -diff
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan

      - name: terraform apply
        if: github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan

  non-persistent:
    name: non-persistent (VPC, EKS, IRSA, namespace)
    needs: persistent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AWS-Configuration/non-persistent
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -diff
      - run: terraform init
      - run: terraform validate

      - name: terraform plan
        if: github.event_name != 'workflow_dispatch' || !inputs.apply_non_persistent
        run: terraform plan -var="create_node_group=true"

      # Single apply: addon ordering is handled in main.tf (vpc-cni/kube-proxy
      # before_compute, coredns + ebs-csi after the node group). The old
      # two-phase apply created coredns/ebs-csi with no nodes -> DEGRADED -> 20m timeout.
      - name: terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply_non_persistent
        run: terraform apply -auto-approve -var="create_node_group=true"

      # Post-apply smoke test: green run = cluster is actually usable, so no
      # local kubectl checks are needed before starting work.
      - name: verify cluster
        if: github.event_name == 'workflow_dispatch' && inputs.apply_non_persistent
        shell: bash
        env:
          CLUSTER: complianceops-eks
          # Same as var.admin_user_arn in non-persistent/main.tf
          ADMIN_USER_ARN: arn:aws:iam::697961193772:user/Ankit-CLI
        run: |
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          kubectl version --client

          echo "::group::EKS add-ons ACTIVE"
          for addon in vpc-cni kube-proxy coredns aws-ebs-csi-driver; do
            aws eks wait addon-active --cluster-name "$CLUSTER" --addon-name "$addon"
            echo "$addon: ACTIVE"
          done
          echo "::endgroup::"

          echo "::group::Nodes Ready"
          kubectl wait --for=condition=Ready nodes --all --timeout=5m
          kubectl get nodes -o wide
          echo "::endgroup::"

          echo "::group::System workloads rolled out"
          for ds in aws-node kube-proxy ebs-csi-node; do
            kubectl -n kube-system rollout status daemonset/$ds --timeout=5m
          done
          for deploy in coredns ebs-csi-controller; do
            kubectl -n kube-system rollout status deployment/$deploy --timeout=5m
          done
          echo "::endgroup::"

          echo "::group::DNS + NAT egress (pulls an image from Docker Hub, resolves a service name)"
          kubectl run verify-dns --image=busybox:1.36 --restart=Never --rm -i \
            --pod-running-timeout=3m -- nslookup kubernetes.default.svc.cluster.local
          echo "::endgroup::"

          echo "::group::App namespace, service accounts, IRSA annotations"
          kubectl get namespace sanctions-platform
          for sa in transaction-sa notifier-sa; do
            role=$(kubectl -n sanctions-platform get sa "$sa" -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}')
            [[ "$role" == arn:aws:iam::* ]] || { echo "::error::$sa has no IRSA role annotation"; exit 1; }
            echo "$sa -> $role"
          done
          echo "::endgroup::"

          echo "::group::Local kubectl access (Ankit-CLI access entry)"
          aws eks list-associated-access-policies --cluster-name "$CLUSTER" --principal-arn "$ADMIN_USER_ARN" \
            --query 'associatedAccessPolicies[].policyArn' --output text | grep -q AmazonEKSClusterAdminPolicy \
            || { echo "::error::$ADMIN_USER_ARN has no cluster-admin access policy"; exit 1; }
          echo "Ankit-CLI has AmazonEKSClusterAdminPolicy"
          echo "::endgroup::"

          {
            echo "## Cluster ready ✅"
            echo '```'
            kubectl get nodes
            echo
            kubectl get pods -n kube-system
            echo '```'
            echo "Connect locally: \`aws eks update-kubeconfig --name $CLUSTER --region $AWS_REGION\`"
          } >> "$GITHUB_STEP_SUMMARY"
