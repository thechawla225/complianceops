name: Terraform Apply

# Push / PR  -> fmt + validate + plan only (never creates billable infra on its own)
# Manual run -> plan + apply (Actions tab -> Terraform Apply -> Run workflow)
on:
  push:
    branches: [main]
    paths:
      - "AWS-Configuration/**"
      - ".github/workflows/terraform-apply.yaml"
  pull_request:
    paths:
      - "AWS-Configuration/**"
      - ".github/workflows/terraform-apply.yaml"
  workflow_dispatch:
    inputs:
      apply_non_persistent:
        description: "Also apply non-persistent (VPC + EKS + nodes — starts NAT/EKS billing)"
        type: boolean
        default: true

permissions:
  id-token: write   # required for OIDC
  contents: read

# One Terraform run at a time across apply/destroy workflows, so two runs
# never race on the same state. Queued runs wait instead of being cancelled.
concurrency:
  group: terraform-complianceops
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  # Must be >= the version that last wrote the state (local machine runs 1.16.2),
  # otherwise init refuses to read a state snapshot from a newer Terraform.
  TF_VERSION: "1.16.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  persistent:
    name: persistent (state bucket, ECR, SQS, CI role)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AWS-Configuration/persistent
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -diff
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan

      - name: terraform apply
        if: github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan

  non-persistent:
    name: non-persistent (VPC, EKS, IRSA, namespace)
    needs: persistent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AWS-Configuration/non-persistent
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -diff
      - run: terraform init
      - run: terraform validate

      - name: terraform plan
        if: github.event_name != 'workflow_dispatch' || !inputs.apply_non_persistent
        run: terraform plan -var="create_node_group=true"

      # Two-phase apply: cluster/addons first, node group second — same
      # reason as apply.ps1 (avoids the addon-before-nodes race).
      - name: terraform apply (control plane + addons)
        if: github.event_name == 'workflow_dispatch' && inputs.apply_non_persistent
        run: terraform apply -auto-approve -var="create_node_group=false"

      - name: terraform apply (node group)
        if: github.event_name == 'workflow_dispatch' && inputs.apply_non_persistent
        run: terraform apply -auto-approve -var="create_node_group=true"
