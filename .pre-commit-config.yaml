# One-time setup per clone:  pre-commit install
# (installs both the pre-commit and commit-msg hooks listed below)
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^gitops/.*/templates/   # Helm templates aren't plain YAML; helm lint covers them
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  # Lints .github/workflows/*: expression typos, invalid keys, bad needs/refs,
  # and the shell inside run: blocks (via shellcheck, if it's on PATH).
  # Built from Go source by pre-commit, so needs Go installed (no Docker).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Blocks commits containing secrets (keys, tokens, passwords)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Commit messages must follow Conventional Commits: <type>(<scope>): <summary>
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, ci, infra, deploy, build, docs, chore, refactor, test, style, perf]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
      # TODO(Phase B): move k8s-network-policies.tf into non-persistent/ and drop these excludes.
      # It's an orphan in the old root module, so validate/tflint can't resolve its references.
      - id: terraform_validate
        exclude: ^AWS-Configuration/k8s-network-policies\.tf$
      - id: terraform_tflint
        exclude: ^AWS-Configuration/k8s-network-policies\.tf$
      - id: terraform_checkov

  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint (all charts, against values-dev.yaml)
        language: system
        files: ^gitops/.*\.(ya?ml|tpl)$
        pass_filenames: false
        entry: >-
          bash -c '
          set -e;
          for d in gitops/*/; do
            [ -f "$d/Chart.yaml" ] || continue;
            echo "linting $d";
            helm lint "$d" -f "$d/values-dev.yaml";
          done'

      - id: helm-template-kubeconform
        name: helm template | kubeconform (schema validation)
        language: system
        files: ^gitops/.*\.(ya?ml|tpl)$
        pass_filenames: false
        entry: >-
          bash -c '
          set -e;
          for d in gitops/*/; do
            [ -f "$d/Chart.yaml" ] || continue;
            echo "validating $d";
            helm template "$d" -f "$d/values-dev.yaml" \
              | kubeconform -strict -summary -kubernetes-version 1.35.0 -;
          done'
