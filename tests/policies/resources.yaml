apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deployment
  namespace: sanctions-platform
  annotations:
    test/case: Deployment checked via autogen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: good-deployment
  template:
    metadata:
      labels:
        app: good-deployment
    spec:
      containers:
      - name: app
        image: 697961193772.dkr.ecr.us-west-2.amazonaws.com/complianceops-gateway:a7dc2ab
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deployment-no-limits
  namespace: sanctions-platform
  annotations:
    test/case: 'no resources at all: the LimitRange would add defaults to the pods, the Deployment check still reports it'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-deployment-no-limits
  template:
    metadata:
      labels:
        app: bad-deployment-no-limits
    spec:
      containers:
      - name: app
        image: 697961193772.dkr.ecr.us-west-2.amazonaws.com/complianceops-gateway:a7dc2ab
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
