# Test resources for policies/. Each pod/Deployment annotation says what it tests; expected results are in
# kyverno-test.yaml. Add a case here and its expected result there.
apiVersion: v1
kind: Pod
metadata:
  name: good-app
  namespace: sanctions-platform
  annotations:
    test/case: our ECR image, container-level securityContext (app charts)
spec:
  containers:
  - name: app
    image: 697961193772.dkr.ecr.us-west-2.amazonaws.com/complianceops-gateway:a7dc2ab
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      allowPrivilegeEscalation: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: good-pod-level-nonroot
  namespace: sanctions-platform
  annotations:
    test/case: allow-listed postgres, runAsNonRoot on the pod (datastore charts)
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
  - name: app
    image: postgres:16.15-trixie@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32
    securityContext:
      allowPrivilegeEscalation: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
---
