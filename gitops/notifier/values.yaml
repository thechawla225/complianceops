# Default values for the notifier chart — overridden per environment by
# values-dev.yaml / values-staging.yaml / values-prod.yaml.

replicaCount: 1

image:
  repository: 697961193772.dkr.ecr.us-west-2.amazonaws.com/complianceops-notifier
  tag: ""
  pullPolicy: IfNotPresent

namespace: sanctions-platform
serviceAccountName: notifier-sa
# IRSA still works: the EKS webhook mounts its own aws-iam-token volume (CKV_K8S_38)
automountServiceAccountToken: false


healthPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 128Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001   # high UID: no overlap with host users (CKV_K8S_40)
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault   # CKV_K8S_31

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10


env:
  SQS_QUEUE_URL: ""
  SLACK_WEBHOOK_URL: ""
  AWS_REGION: "us-west-2"
  LOG_LEVEL: "info"

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
