{{- /* The notifier has no Service (nothing calls it), so a ServiceMonitor has nothing to select:
       a PodMonitor scrapes the pod's /metrics directly on its http port (Phase 08.1, ADR 0016). */ -}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "notifier.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "notifier.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "notifier.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
