namespace: sanctions-platform

image:
  repository: postgres
  # Debian 13 base, same as the other images. Pinned by digest: Docker Hub tags are mutable, and Kyverno
  # allow-lists this exact image (policies/restrict-image-registries.yaml). Change both together.
  tag: "16.15-trixie@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32"
  pullPolicy: IfNotPresent

database: complianceops
user: complianceops
# Built by External Secrets Operator from AWS Secrets Manager (templates/externalsecret.yaml, ADR 0015).
# The transaction chart reads DATABASE_URL from the same Secret.
existingSecretName: postgres-credentials

# Off by default so the chart installs where External Secrets isn't present (CI's kind smoke test creates the Secret
# itself); on in dev (values-dev.yaml).
externalSecret:
  enabled: false
  region: us-west-2
  remoteKey: complianceops/dev/postgres   # persistent/secrets.tf
  refreshInterval: 1h

port: 5432

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
