{{- if .Values.externalSecret.enabled }}
# Builds the postgres-credentials Secret (same name and keys as before, so postgres and transaction are unchanged)
# from AWS Secrets Manager (ADR 0015). No auth block: the External Secrets controller's IRSA role is used.
# Fields the API server would default are written out, so Argo CD doesn't see drift between Git and the live object.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: {{ .Values.namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.region }}
      sessionTagsPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.existingSecretName }}
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: {{ .Values.existingSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        POSTGRES_PASSWORD: {{ `"{{ .password }}"` }}
        DATABASE_URL: {{ printf "\"postgresql+asyncpg://%s:{{ .password }}@postgres.%s.svc.cluster.local:%v/%s\"" .Values.user .Values.namespace .Values.port .Values.database }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: password
{{- end }}
