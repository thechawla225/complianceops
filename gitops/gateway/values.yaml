
replicaCount: 1

image:
  repository: 697961193772.dkr.ecr.us-west-2.amazonaws.com/complianceops-gateway
  tag: ""
  pullPolicy: IfNotPresent

namespace: sanctions-platform
serviceAccountName: sanctions-platform-sa
# IRSA still works: the EKS webhook mounts its own aws-iam-token volume (CKV_K8S_38)
automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 8000


resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi


securityContext:
  runAsNonRoot: true
  runAsUser: 10001   # high UID: no overlap with host users (CKV_K8S_40)
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault   # CKV_K8S_31

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10


env:
  TRANSACTION_SERVICE_URL: ""
  LOG_LEVEL: "info"

ingress:
  enabled: false

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
