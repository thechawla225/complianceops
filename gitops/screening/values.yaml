replicaCount: 1

image:
  repository: 697961193772.dkr.ecr.us-west-2.amazonaws.com/complianceops-screening
  tag: ""  
  pullPolicy: IfNotPresent

namespace: sanctions-platform
serviceAccountName: sanctions-platform-sa

service:
  type: ClusterIP
  port: 8080   


resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 1000

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10


env:
  REDIS_HOST: ""
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"

ingress:
  enabled: false

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
